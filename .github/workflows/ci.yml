name: UnitTest

on: [push, pull_request]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.4', '8.5', '8.6' ]
        include:
          - php: '8.6'
            allow_failure: true
    services:
      memcached:
        image: memcached:1.6-alpine
        ports: ['11211:11211']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Ut1234!pass'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ut1234!pass' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      sqs:
        image: softwaremill/elasticmq-native:1.6.11
        ports: ['9324:9324']
    steps:
      - uses: actions/checkout@v4
      - name: Setup MySQL
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql version: '8.1'
          mysql database: windwalker_test
          mysql root password: ut1234
      - name: Setup PostgreSQL
        run: docker run -d --rm --name postgres -e POSTGRES_PASSWORD=ut1234 -e POSTGRES_DB=windwalker_test -p 5432:5432 postgres:16
      - name: Setup ODBC Driver for SQL Server
        shell: bash
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sodium, fileinfo, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, pdo_sqlsrv, sqlsrv, mysqli, memcached, redis, sqlite3, swoole
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-
      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-progress
      - name: Start PHP server
        shell: bash
        run: php -S localhost:8100 bin/test-server.php > /tmp/php-server.log 2>&1 &
      - name: Run integration tests
        run: php vendor/bin/phpunit --configuration phpunit.ci.xml
        env:
          REDIS_PORT: '6379'

  windows:
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sodium, fileinfo, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, mysqli, sqlite3
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Composer
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-
      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-progress
      - name: Start PHP server (native Windows process)
        run: |
          $php = (Get-Command php).Source
          Start-Process -FilePath $php -ArgumentList @('-S', '127.0.0.1:8100', 'bin/test-server.php') -PassThru | Out-Null
      - name: Run Windows-compatible PHPUnit tests
        # IMPORTANT: These groups must be annotated in the project tests.
        # Excluding groups has no effect on ungrouped integration tests.
        run: php vendor/bin/phpunit --configuration phpunit.ci.xml --exclude-group integration,redis,memcached,sqlserver,sqs,mysql,pgsql
