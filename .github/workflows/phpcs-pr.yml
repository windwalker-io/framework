name: Code Styles for PR

on: [ pull_request ]

jobs:
    php-cs-fixer:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer, cs2pr
                  extensions: mbstring, intl

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Setup cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer update --prefer-dist --prefer-stable --no-progress

            - name: Cache PHP-CS-Fixer
              uses: actions/cache@v6
              with:
                  path: .php-cs-fixer.cache
                  key: ${{ runner.os }}-php-cs-fixer-${{ github.sha }}
                  restore-keys: ${{ runner.os }}-php-cs-fixer-

            - name: Detect coding standard violations
              run: vendor/bin/php-cs-fixer check --format=checkstyle | cs2pr
