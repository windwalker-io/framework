name: 'Repo Lockdown'

on:
  pull_request_target:
    types: opened
  issues:
    types: opened

permissions:
  issues: write
  pull-requests: write

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/repo-lockdown@v5
        with:
          pr-comment: >
            This is a read-only split of https://github.com/windwalker-io/framework.
            Please open pull requests at the main repository instead.
          issue-comment: >
            This is a read-only split of https://github.com/windwalker-io/framework.
            Please open issues at https://github.com/windwalker-io/framework/issues instead.
